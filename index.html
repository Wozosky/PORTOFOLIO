<!doctype html>
<html
  <head>
    <title>Practice</title>
    </head>
    <style>
      * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

body {
    background-size: cover;
    background-image: url(DAPP.jpg);
    display: flex;
}

nav {
    background-color: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(10px);
    position: fixed;
    padding: 1rem;
    width: 80%;
    left: 50%;
    transform: translateX(-50%);
    top: 2rem;
    border-radius: 30px;
    border: 1px solid rgba(255, 255, 255, 0.6);
    box-shadow: 0 6px 6px rgba(0, 0, 0, 0.5);
}

ul {
    list-style: none;
    display: flex;
    justify-content: center;
    gap: 3rem;
}

a {
    text-decoration: none;
    color: #101000;
    font-size: 25px;
    transition: color 0.3s ease;
    padding: 5px 0;
    position: relative;
}

a::after {
    content: "";
    position: absolute;
    width: 0;
    height: 2px;
    left: 50%;
    bottom: 0;
    background: white;
    transition: all 0.3s ease;
}

a:hover::after {
    width: 100%;
    left: 0;
}

a:hover {
    color: rgb(249, 255, 74);
}
    </style>
    <body>
      <nav>
        <ul>
          <li><a href="#"">Home</a></li>
          <li><a href="#">About</a></li>
          <li><a href="#">Contact</a></li>
          <li><a href="portofolio.html">Portfolio</a></li> 
          <li><a href="#">Skill</a></li>
        </ul>
      </nav>
      <style>.profile {
    text-align: center;
    margin: 40px auto;
}

.profile img {
    width: 150px;
    height: 150px;
    object-fit: cover;
    border-radius: 50%;
    margin-top: 235px;

    border: 3px solid white;

    box-shadow:
        0 0 10px white,
        0 0 25px cyan,
        0 0 45px rgb(212, 17, 241);
}

.profile h2 {
    margin: 15px 0 5px;
}

.profile p {
    margin: 0;
}</style>
      <div class="profile">
    <img src="mike.png" alt="Foto Profil">

    <p>Graphic Designer & Web Developer</p>
</div>
    </body>
</html>
