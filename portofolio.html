<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PORTOFOLIO</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            min-height: 100vh;
            padding: 50px;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .deskripsi {
            text-align: center;
            margin-bottom: 40px;
        }

        .portfolio-container {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        .card {
            width: 330px;
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .card img {
            width: 100%;
            border-radius: 15px;
        }

        .card h2 {
            margin-top: 15px;
            margin-bottom: 10px;
        }

        .card p {
            line-height: 1.5;
        }

        .kembali {
            display: block;
            width: fit-content;
            margin: 40px auto 0;
            padding: 10px 20px;
            background: white;
            color: black;
            text-decoration: none;
            border-radius: 20px;
        }
    </style>
</head>

<body>

    <h1>Portfolio</h1>

    <p class="deskripsi">
        Berikut adalah beberapa hasil karya saya.
    </p>

    <div class="portfolio-container">

        <div class="card">
            <img src="MAULID morch rp.png" alt="Poster Maulid Nabi">

            <h2>Desain Poster</h2>

            <p>
                Poster Maulid Nabi Muhammad SAW yang dibuat
                untuk server GTA SAMP Morch Roleplay
            </p>
        </div>

        <div class="card">
            <img src="MAULID 33.png" alt="Poster Maulid Nabi">

            <h2>Poster Islami</h2>

            <p>
                Desain poster dengan tema Maulid Nabi
                menggunakan warna hijau dan elemen dekorasi
                islami, poster.
            </p>
        </div>

    </div>

    <a class="kembali" href="index.html">← BACK TO HOME POOR PEOPLE</a>

</body>
</html>
